version: '3.8'

services:
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - EUREKA_URI=http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  book-service:
    build: ./book-service
    container_name: book-service
    ports:
      - "9998:9998"
    environment:
      - EUREKA_URI=http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8889:8889"
    environment:
      - EUREKA_URI=http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy

  library-service:
    build: ./library-service
    container_name: library-service
    ports:
      - "8090:8090"
    environment:
      - EUREKA_URI=http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
